image: node:20
stages:
  - check
  - format
  - lint
  - deploy
  - test
variables:
  FORCE_COLOR: '1'
  PRODUCTION_PATH: public
  NODE_ENV: development
  CI: 'true'
cache:
  key:
    files:
      - pnpm-lock.yaml
      - package.json
    prefix: '${CI_COMMIT_REF_SLUG}'
  paths:
    - node_modules/
  policy: pull-push
node-checker:
  stage: check
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
  before_script: []
  script:
    - echo "Checking if node_modules is tracked in Git..."
    - |
      if git ls-files node_modules/ | grep -q .; then
        echo -e "\e[1;31mERROR: The node_modules/ folder is being tracked in Git.\e[0m"
        echo -e "\e[1;33mThis is not allowed because:\e[0m"
        echo "1. It can contain sensitive information"
        echo "2. It makes the repository unnecessarily large"
        echo "3. It can cause conflicts in dependency management"
        echo -e "\n\e[1;33mTo fix this:\e[0m"
        echo "1. Remove node_modules from git tracking:"
        echo "   git rm -r --cached node_modules"
        echo "2. Commit the change:"
        echo "   git commit -m 'Remove node_modules from git tracking'"
        echo "3. Push the changes:"
        echo "   git push"
        echo -e "\n\e[1;33mNote: Make sure node_modules is in your .gitignore file\e[0m"
        exit 1;
      fi
before_script:
  - npm install -g pnpm
  - pnpm install --frozen-lockfile
prettier-check:
  stage: format
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
  script:
    - echo "Checking Prettier formatting..."
    - pnpm prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,scss,md}"
eslint:
  stage: lint
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
  script:
    - echo "Running ESLint..."
    - pnpm eslint "**/*.{js,jsx,ts,tsx}"
build-deploy-job:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/gitlab-deploy
    - chmod 600 ~/.ssh/gitlab-deploy
    - ssh-add ~/.ssh/gitlab-deploy
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts || true
  script:
    - chmod 700 ~/.ssh
    - ssh -o StrictHostKeyChecking=no deploy@13.50.242.114 "cd /var/www/api && git pull && pnpm install --frozen-lockfile && pnpm build && sudo -u ubuntu pm2 restart api --update-env"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
test:
  stage: test
  variables:
    NODE_ENV: test
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
  script:
    - echo "Running tests..."
    - pnpm test
  artifacts:
    reports:
      junit: test-results.xml
    when: always
    expire_in: 1 week
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
